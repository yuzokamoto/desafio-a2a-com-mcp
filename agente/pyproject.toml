[project]
name = "agente"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0", "uvicorn==0.54.0", "starlette==1.10.0", "a2a-sdk[http-server]==1.2.3"]

[project.scripts]
agente = "agente.app:main"

[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest==9.0.2", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
