[project]
name = "servidor-mcp"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0", "uvicorn==0.54.0", "pydantic==2.14.1"]

[project.scripts]
servidor-mcp = "servidor_mcp.server:main"

[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest==9.0.2", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
